[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]


[tool.setuptools.packages.find]
where = ["src"]
include = ["aiq.*"]


[tool.setuptools_scm]
root = "../.."


[project]
name = "agentiq-hf"
dynamic = ["version"]
dependencies = [
  # Keep package version constraints as open as possible to avoid conflicts with other packages. Always define a minimum
  # version when adding a new package. If unsure, default to using `~=` instead of `==`. Does not apply to aiq packages.
  # Keep sorted!!!
  "agentiq",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.49.0",
  "sentencepiece==0.2.0",
]
requires-python = ">=3.12"
description = "Subpackage for HuggingFace integration in AgentIQ"
keywords = ["ai", "rag", "agents"]
classifiers = ["Programming Language :: Python"]


[tool.uv]
config-settings = { editable_mode = "compat" }


[tool.uv.sources]
agentiq = { workspace = true }


[project.entry-points.'aiq.components']
aiq_hf = "aiq.plugins.hf.register"
