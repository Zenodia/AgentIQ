[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
root = "../.."

[project]
name = "aiq_hf_exp"
dynamic = ["version"]
dependencies = [
  "agentiq[langchain]",
  "colorama==0.4.6",
  "matplotlib==3.9.*",
  "seaborn==0.13.*",
  "smolagents==1.10.0",
  "litellm",
]
requires-python = ">=3.12"
description = "HuggingFace SmolAgent AgentIQ example"
keywords = ["ai", "hf", "agents"]
classifiers = ["Programming Language :: Python"]

[tool.uv.sources]
agentiq = { path = "../../", editable = true }

[project.entry-points.'aiq.components']
aiq_hf_exp = "aiq_hf_exp.register"
