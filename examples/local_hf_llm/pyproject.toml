[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 64", "setuptools-scm>=8"]

[tool.setuptools_scm]
root = "../.."

[project]
name = "aiq_local_hf_llm"
dynamic = ["version"]
dependencies = [
  "agentiq",
  "arxiv~=2.1.3",
  "colorama~=0.4.6",
  "markdown-it-py~=3.0",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.49.0",
  "sentencepiece==0.2.0",
  "langdetect",
]
requires-python = ">=3.12"
description = "Custom AgentIQ Workflow"
classifiers = ["Programming Language :: Python"]

[tool.uv.sources]
agentiq = { path = "../../", editable = true }

[project.entry-points.'aiq.components']
aiq_local_hf_llm = "aiq_local_hf_llm.register"
